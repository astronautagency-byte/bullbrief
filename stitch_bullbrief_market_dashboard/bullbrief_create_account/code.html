<!DOCTYPE html>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
        
        body {
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient glow for the dark theme */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, rgba(5, 20, 36, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Custom input autofill styles for dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #051424 inset !important;
            -webkit-text-fill-color: #d4e4fa !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-4 md:p-8 relative overflow-hidden">
<!-- Decorative Ambient Layer -->
<div class="ambient-glow"></div>
<div class="absolute top-0 right-0 w-1/3 h-1/3 bg-primary/5 blur-[120px] rounded-full mix-blend-screen pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-1/4 h-1/4 bg-primary/5 blur-[100px] rounded-full mix-blend-screen pointer-events-none"></div>
<!-- Main Form Container -->
<main class="w-full max-w-[440px] relative z-10 flex flex-col gap-6">
<!-- Header / Logo -->
<div class="flex flex-col items-center text-center gap-4 mb-4">
<img alt="BullBrief Logo" class="h-16 w-auto object-contain drop-shadow-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYpey_MjTWWk0LThnMgAd4BP0o1ny2ykTkiELlkDEzcMtBKfMLRa8GzsMttAsSTp_2bE5pBB0TrlupTkAJwRCzBnMnmQZK_OL-QFNLOsPyUEj2MKxtYf6LDbfT2vvZabpav6LS_xLnCqYMeL2AixfvifIoaFoJy8ejNXRGYSo_vuwKMm3HCNWsDHrivu60HNbWcAkbGzvrGkZeoVoSY-M15KF3GPj4xhTvEhwrVvTB7oKdttlulbWDDIHg8AgN8RIp6w"/>
<div class="flex flex-col gap-1 mt-2">
<h1 class="font-headline-md text-headline-md text-on-surface italic tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the premier platform for professional market intelligence.</p>
</div>
</div>
<!-- Glassmorphism Card -->
<div class="bg-surface-container/60 backdrop-blur-xl border border-surface-variant rounded-xl p-card-padding md:p-8 shadow-2xl relative overflow-hidden">
<!-- Subtle top border highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
<form class="flex flex-col gap-stack-gap">
<!-- Social Sign Up Options -->
<div class="flex gap-4 mb-2">
<button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-background border border-surface-variant hover:border-primary/50 hover:bg-surface-container-highest transition-colors rounded-lg font-label-md text-label-md text-on-surface group" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-primary transition-colors">account_circle</span>
                        Google
                    </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 bg-background border border-surface-variant hover:border-primary/50 hover:bg-surface-container-highest transition-colors rounded-lg font-label-md text-label-md text-on-surface group" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-primary transition-colors">devices</span>
                        Apple
                    </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-3 my-2">
<div class="h-px bg-surface-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or</span>
<div class="h-px bg-surface-variant flex-1"></div>
</div>
<!-- Full Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[20px]">person</span>
<input class="w-full bg-background border border-outline-variant text-on-surface rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md placeholder-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary/30 focus:outline-none transition-all shadow-sm shadow-black/20" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[20px]">mail</span>
<input class="w-full bg-background border border-outline-variant text-on-surface rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md placeholder-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary/30 focus:outline-none transition-all shadow-sm shadow-black/20" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 mb-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[20px]">lock</span>
<input class="w-full bg-background border border-outline-variant text-on-surface rounded-lg py-2.5 pl-10 pr-10 font-body-md text-body-md placeholder-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary/30 focus:outline-none transition-all shadow-sm shadow-black/20" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/70 mt-1">Must be at least 8 characters long.</p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-headline-md text-headline-md !text-[18px] py-3 rounded-lg transition-all duration-200 shadow-[0_0_15px_rgba(75,226,119,0.2)] hover:shadow-[0_0_25px_rgba(75,226,119,0.4)] active:scale-[0.98] mt-2 flex justify-center items-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Terms -->
<p class="font-label-sm text-label-sm text-center text-on-surface-variant/60 mt-4 leading-relaxed">
                    By creating an account, you agree to our <br/>
<a class="text-primary hover:underline underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:underline underline-offset-2" href="#">Privacy Policy</a>.
                </p>
</form>
</div>
<!-- Footer Link -->
<div class="text-center font-body-md text-body-md text-on-surface-variant mt-2">
            Already have an account? 
            <a class="text-primary font-bold hover:text-primary-fixed transition-colors underline underline-offset-4 decoration-primary/30 hover:decoration-primary" href="#">Log in</a>
</div>
</main>
</body></html>
