<style>

            box-shadow: 0 0 8px rgba(34, 197, 94, 0.2);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Suppressed TopAppBar and Footer as this is a transactional flow (Reset Password) -->
<main class="flex-grow flex items-center justify-center p-container-margin">
<div class="w-full max-w-md">
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-primary italic font-black tracking-tighter mb-2">BullBrief</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Secure your access.</p>
</div>
<div class="bg-surface-container p-8 rounded-xl border border-surface-variant relative overflow-hidden">
<div class="mb-6">
<h2 class="font-headline-md text-headline-md font-bold mb-1">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter a new strong password below to regain access to your terminal.</p>
</div>
<form class="space-y-stack-gap">
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<input class="w-full bg-background border border-surface-variant rounded-lg py-3 pl-10 pr-10 text-on-surface focus:border-primary focus:ring-0 input-glow font-body-md transition-colors" id="new-password" name="new-password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirm New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<input class="w-full bg-background border border-surface-variant rounded-lg py-3 pl-10 pr-10 text-on-surface focus:border-primary focus:ring-0 input-glow font-body-md transition-colors" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-headline-md text-body-lg font-bold py-3 rounded-lg hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 active:scale-95 shadow-[0_0_15px_rgba(34,197,94,0.3)]" type="submit">
                            Update Password
                            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-6 text-center">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors underline decoration-on-surface-variant hover:decoration-primary underline-offset-4" href="#">Return to Login</a>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">
                    Need help? Contact <a class="text-primary hover:underline" href="#">Support</a>.
                 </p>
</div>
</div>
</main>
<script>
        // Simple toggle visibility logic for demonstration
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('span');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
