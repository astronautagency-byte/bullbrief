<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">mail</span>
<input class="w-full bg-background border border-surface-variant rounded-lg py-2.5 pl-10 pr-4 text-on-background focus:border-primary focus:ring-1 focus:ring-primary input-glow transition-all duration-200 outline-none font-body-md" id="email" placeholder="trader@example.com" type="email"/>
</div>
